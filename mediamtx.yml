# Local development only. Public deployment must add authenticated access.
logLevel: warn
rtspTransports: [tcp]
api: yes
apiAddress: :9997
# Laptop demo access policy.
# - This laptop, the Docker networks and Docker Desktop's host gateway may
#   publish, read and use the control API (the console reads WebRTC from here).
# - Anything else on the LAN (a phone on Wi-Fi) may only PUBLISH, only to
#   phone-* paths, and only with the phone credential. Nobody on the LAN can
#   watch a camera. RTMP (1935) is the only port opened to the LAN.
authInternalUsers:
  - user: any
    pass:
    ips: ['127.0.0.1', '::1', '172.16.0.0/12', '192.168.65.0/24']
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api
      - action: metrics
  - user: phone
    pass: smartops-phone
    ips: []
    permissions:
      - action: publish
        path: ~^phone-
rtmp: yes
hls: yes
hlsVariant: lowLatency
webrtc: yes
webrtcAdditionalHosts: [localhost, 127.0.0.1]
paths:
  all_others:
