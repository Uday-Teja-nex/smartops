name: smartops

services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.2
    container_name: smartops-mediamtx
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "127.0.0.1:8554:8554"
      # RTMP ingest from phones on the LAN (publish-only credential; see mediamtx.yml).
      - "1935:1935"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:8189:8189/udp"
      - "127.0.0.1:9997:9997"
    restart: unless-stopped

  stream-publisher:
    build:
      context: ./services/stream-publisher
    container_name: smartops-stream-publisher
    environment:
      # One looping RTSP stream per entry in sample-data/streams.json.
      SMARTOPS_STREAM_MANIFEST: /config/${SMARTOPS_STREAM_MANIFEST_FILE:-streams.json}
      SMARTOPS_MEDIA_ROOT: /media
      SMARTOPS_RTSP_BASE: rtsp://mediamtx:8554
    volumes:
      - ./sample-data/input:/media:ro
      - ./sample-data:/config:ro
      - publisher_cache:/cache
    depends_on:
      - mediamtx
    restart: unless-stopped

  stream-processor:
    build:
      context: ./services/video-ingest
      dockerfile: Dockerfile.processor
    container_name: smartops-stream-processor
    volumes:
      - processor_data:/data
    environment:
      SMARTOPS_STREAM_SOURCE_IDS: ${SMARTOPS_STREAM_SOURCE_IDS:-}
      SMARTOPS_MAX_STREAMS: ${SMARTOPS_MAX_STREAMS:-4}
      SMARTOPS_STREAM_FPS: ${SMARTOPS_STREAM_FPS:-3}
      SMARTOPS_RTSP_DECODE_THREADS: ${SMARTOPS_RTSP_DECODE_THREADS:-1}
      SMARTOPS_STREAM_ENRICHMENT: ${SMARTOPS_STREAM_ENRICHMENT:-false}
      # Laptop CPU reviews ~3 incidents a minute; 0 reviews every incident (hosted/GPU model).
      SMARTOPS_REVIEW_MIN_INTERVAL_SECONDS: ${SMARTOPS_REVIEW_MIN_INTERVAL_SECONDS:-120}
      SMARTOPS_ORCHESTRATOR_BASE_URL: http://orchestrator:8100
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      SMARTOPS_MINIO_ENDPOINT: ${SMARTOPS_MINIO_ENDPOINT:-http://minio:9000}
      SMARTOPS_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-smartops}
      SMARTOPS_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-smartopsminio}
      SMARTOPS_MINIO_BUCKET: ${SMARTOPS_MINIO_BUCKET:-smartops-evidence}
      SMARTOPS_API_BASE_URL: http://api:8000
      SMARTOPS_DETECTOR_BASE_URL: http://detector:8200
      SMARTOPS_INTERNAL_TOKEN: ${SMARTOPS_INTERNAL_TOKEN:-smartops-internal-dev-token}
      OPENCV_FFMPEG_CAPTURE_OPTIONS: rtsp_transport;tcp
    depends_on:
      api:
        condition: service_healthy
      detector:
        condition: service_healthy
      mediamtx:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: production
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: smartops-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

  api:
    build:
      context: ./services/api
    container_name: smartops-api
    environment: &api-env
      SMARTOPS_ENVIRONMENT: ${SMARTOPS_ENVIRONMENT:-development}
      SMARTOPS_DATABASE_URL: ${SMARTOPS_DATABASE_URL:-postgresql+psycopg://smartops:smartops@postgres:5432/smartops}
      SMARTOPS_REDIS_URL: ${SMARTOPS_REDIS_URL:-redis://redis:6379/0}
      SMARTOPS_MODEL_PROVIDER: ${SMARTOPS_MODEL_PROVIDER:-ollama}
      SMARTOPS_ORCHESTRATOR_NAME: langgraph
      SMARTOPS_CORS_ORIGINS: ${SMARTOPS_CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      SMARTOPS_SOURCE_ROOT: /app/sample-data/input
      SMARTOPS_MEDIAMTX_WEBRTC_PUBLIC_URL: ${SMARTOPS_MEDIAMTX_WEBRTC_PUBLIC_URL:-http://localhost:8889}
      SMARTOPS_MEDIAMTX_RTSP_HOST: ${SMARTOPS_MEDIAMTX_RTSP_HOST:-mediamtx}
      SMARTOPS_SEED_DEMO_DATA: ${SMARTOPS_SEED_DEMO_DATA:-true}
      SMARTOPS_REQUEST_MAX_BYTES: ${SMARTOPS_REQUEST_MAX_BYTES:-2097152}
      SMARTOPS_MINIO_ENDPOINT: ${SMARTOPS_MINIO_ENDPOINT:-http://minio:9000}
      SMARTOPS_MINIO_PUBLIC_ENDPOINT: ${SMARTOPS_MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      SMARTOPS_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-smartops}
      SMARTOPS_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-smartopsminio}
      SMARTOPS_MINIO_BUCKET: ${SMARTOPS_MINIO_BUCKET:-smartops-evidence}
      SMARTOPS_EVIDENCE_URL_TTL_SECONDS: ${SMARTOPS_EVIDENCE_URL_TTL_SECONDS:-600}
      SMARTOPS_EVIDENCE_STORAGE_ENABLED: ${SMARTOPS_EVIDENCE_STORAGE_ENABLED:-true}
      SMARTOPS_JWT_SECRET: ${SMARTOPS_JWT_SECRET:-smartops-dev-secret-change-me}
      SMARTOPS_JWT_TTL_MINUTES: ${SMARTOPS_JWT_TTL_MINUTES:-15}
      SMARTOPS_REFRESH_TTL_HOURS: ${SMARTOPS_REFRESH_TTL_HOURS:-12}
      SMARTOPS_REFRESH_COOKIE_SECURE: ${SMARTOPS_REFRESH_COOKIE_SECURE:-false}
      SMARTOPS_INTERNAL_TOKEN: ${SMARTOPS_INTERNAL_TOKEN:-smartops-internal-dev-token}
      SMARTOPS_CONSOLE_PUBLIC_URL: ${SMARTOPS_CONSOLE_PUBLIC_URL:-http://localhost:3000}
      SMARTOPS_INGEST_PUBLIC_HOST: ${SMARTOPS_INGEST_HOST:-localhost}
      SMARTOPS_PLATFORM_ADMIN_EMAILS: ${SMARTOPS_PLATFORM_ADMIN_EMAILS:-admin@smartops.local}
    volumes:
      - ./sample-data:/app/sample-data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  notifier:
    # Same image as the API; sends the notification outbox (Telegram, webhook).
    build:
      context: ./services/api
    container_name: smartops-notifier
    command: ["python", "-m", "app.notifier"]
    environment: *api-env
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 15s
    restart: unless-stopped

  orchestrator:
    build:
      context: ./services/orchestrator
    container_name: smartops-orchestrator
    environment:
      SMARTOPS_MODEL_PROVIDER: ${SMARTOPS_MODEL_PROVIDER:-ollama}
      SMARTOPS_OLLAMA_HOST: ${SMARTOPS_OLLAMA_HOST:-http://host.docker.internal:11434}
      SMARTOPS_TEXT_MODEL: ${SMARTOPS_TEXT_MODEL:-llama3.2:3b}
      SMARTOPS_VISION_MODEL: ${SMARTOPS_VISION_MODEL:-qwen2.5vl:3b}
      SMARTOPS_MODEL_TIMEOUT_SECONDS: ${SMARTOPS_MODEL_TIMEOUT_SECONDS:-30}
      SMARTOPS_MODEL_API_KEY: ${SMARTOPS_MODEL_API_KEY:-}
      SMARTOPS_MODEL_BASE_URL: ${SMARTOPS_MODEL_BASE_URL:-}
      SMARTOPS_OPENROUTER_FREE_ONLY: ${SMARTOPS_OPENROUTER_FREE_ONLY:-true}
      SMARTOPS_OPENROUTER_DATA_COLLECTION: ${SMARTOPS_OPENROUTER_DATA_COLLECTION:-deny}
      SMARTOPS_REVIEW_CONFIDENCE_THRESHOLD: ${SMARTOPS_REVIEW_CONFIDENCE_THRESHOLD:-0.6}
      # Optional: when the primary provider is rate-limited or down, use native Ollama.
      SMARTOPS_MODEL_FALLBACK: ${SMARTOPS_MODEL_FALLBACK:-}
      SMARTOPS_FALLBACK_VISION_MODEL: ${SMARTOPS_FALLBACK_VISION_MODEL:-qwen2.5vl:3b}
      SMARTOPS_FALLBACK_TEXT_MODEL: ${SMARTOPS_FALLBACK_TEXT_MODEL:-llama3.2:3b}
      SMARTOPS_OLLAMA_NUM_THREAD: ${SMARTOPS_OLLAMA_NUM_THREAD:-4}
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  detector:
    build:
      context: ./services/detector
    container_name: smartops-detector
    environment:
      SMARTOPS_DETECTOR_BACKEND: ${SMARTOPS_DETECTOR_BACKEND:-ultralytics-cpu}
      SMARTOPS_DETECTOR_DEVICE: ${SMARTOPS_DETECTOR_DEVICE:-cuda:0}
      SMARTOPS_DETECTOR_REMOTE_URL: ${SMARTOPS_DETECTOR_REMOTE_URL:-}
      SMARTOPS_DETECTOR_REMOTE_TOKEN: ${SMARTOPS_DETECTOR_REMOTE_TOKEN:-}
      SMARTOPS_HF_TOKEN: ${SMARTOPS_HF_TOKEN:-}
      SMARTOPS_HF_MODEL: ${SMARTOPS_HF_MODEL:-facebook/detr-resnet-50}
      SMARTOPS_HF_TIMEOUT_SECONDS: ${SMARTOPS_HF_TIMEOUT_SECONDS:-10}
      SMARTOPS_DETECTOR_CPU_THREADS: ${SMARTOPS_DETECTOR_CPU_THREADS:-2}
      SMARTOPS_DETECTOR_IMAGE_SIZE: ${SMARTOPS_DETECTOR_IMAGE_SIZE:-640}
      SMARTOPS_YOLO_MODEL: ${SMARTOPS_YOLO_MODEL:-yolov8n.pt}
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8200/health', timeout=3).status==200 else 1)"]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  worker:
    # Retired windowed file pipeline (ADR 0007); kept only for comparison runs.
    profiles: [legacy]
    build:
      context: ./services/worker
    container_name: smartops-worker
    environment:
      SMARTOPS_REDIS_URL: ${SMARTOPS_REDIS_URL:-redis://redis:6379/0}
      SMARTOPS_API_BASE_URL: http://api:8000
      SMARTOPS_ORCHESTRATOR_BASE_URL: http://orchestrator:8100
      SMARTOPS_DETECTOR_BASE_URL: http://detector:8200
      SMARTOPS_SOURCE_ROOT: /app/sample-data/input
      SMARTOPS_CANDIDATE_QUEUE: smartops:candidate_jobs
      SMARTOPS_DEAD_LETTER_QUEUE: smartops:candidate_jobs:dead
      SMARTOPS_SAMPLE_FRAME_COUNT: ${SMARTOPS_SAMPLE_FRAME_COUNT:-3}
      SMARTOPS_MAX_FRAME_WIDTH: ${SMARTOPS_MAX_FRAME_WIDTH:-640}
      SMARTOPS_JOB_MAX_ATTEMPTS: ${SMARTOPS_JOB_MAX_ATTEMPTS:-3}
      SMARTOPS_CROWD_PERSON_THRESHOLD: ${SMARTOPS_CROWD_PERSON_THRESHOLD:-4}
      SMARTOPS_MIN_DETECTION_CONFIDENCE: ${SMARTOPS_MIN_DETECTION_CONFIDENCE:-0.35}
      SMARTOPS_MINIO_ENDPOINT: ${SMARTOPS_MINIO_ENDPOINT:-http://minio:9000}
      SMARTOPS_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-smartops}
      SMARTOPS_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-smartopsminio}
      SMARTOPS_MINIO_BUCKET: ${SMARTOPS_MINIO_BUCKET:-smartops-evidence}
      SMARTOPS_EVIDENCE_ENABLED: ${SMARTOPS_EVIDENCE_ENABLED:-true}
      SMARTOPS_EVIDENCE_CLIP_MAX_SECONDS: ${SMARTOPS_EVIDENCE_CLIP_MAX_SECONDS:-20}
      SMARTOPS_INTERNAL_TOKEN: ${SMARTOPS_INTERNAL_TOKEN:-smartops-internal-dev-token}
    volumes:
      - ./sample-data:/app/sample-data:ro
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      detector:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  video-ingest:
    profiles: [legacy]
    build:
      context: ./services/video-ingest
    container_name: smartops-video-ingest
    environment:
      SMARTOPS_SOURCE_ROOT: /app/sample-data/input
      SMARTOPS_API_BASE_URL: http://api:8000
      SMARTOPS_REDIS_URL: ${SMARTOPS_REDIS_URL:-redis://redis:6379/0}
      SMARTOPS_CANDIDATE_QUEUE: smartops:candidate_jobs
      SMARTOPS_SCAN_INTERVAL_SECONDS: ${SMARTOPS_SCAN_INTERVAL_SECONDS:-30}
      SMARTOPS_AUTODISCOVER_MP4: ${SMARTOPS_AUTODISCOVER_MP4:-true}
      SMARTOPS_DEFAULT_BUILDING_ID: ${SMARTOPS_DEFAULT_BUILDING_ID:-bldg-north-01}
      SMARTOPS_DEFAULT_FLOOR: ${SMARTOPS_DEFAULT_FLOOR:-L1}
      SMARTOPS_DEFAULT_ZONE: ${SMARTOPS_DEFAULT_ZONE:-Lobby Atrium}
      SMARTOPS_MAX_WINDOWS_PER_SOURCE: ${SMARTOPS_MAX_WINDOWS_PER_SOURCE:-12}
      SMARTOPS_INTERNAL_TOKEN: ${SMARTOPS_INTERNAL_TOKEN:-smartops-internal-dev-token}
    volumes:
      - ./sample-data:/app/sample-data:ro
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: smartops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartops}
      POSTGRES_USER: ${POSTGRES_USER:-smartops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartops -d smartops"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: smartops-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: smartops-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartops}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smartopsminio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    profiles: [docker-ollama]
    image: ollama/ollama:latest
    container_name: smartops-ollama
    environment:
      # Keep memory pressure low on laptop Docker VMs: one model in memory
      # at a time, no parallel requests, unload quickly after use.
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-2m}
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  processor_data:
  publisher_cache:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
