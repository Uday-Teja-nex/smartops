name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: Frontend lint / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api:
    name: API service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r services/api/requirements.txt pytest httpx
      - run: python -m pytest services/api/tests -q

  orchestrator:
    name: Orchestrator graph tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r services/orchestrator/requirements.txt pytest
      - run: python -m pytest services/orchestrator/tests -q

  worker:
    name: Worker gating/retry tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r services/worker/requirements.txt pytest
      - run: python -m pytest services/worker/tests -q

  compose:
    name: Docker Compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.soak.yml --profile demo-streams config --quiet

  streams:
    name: Stream tracking / rules / delivery tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r services/video-ingest/requirements-processor.txt pytest
      - run: python -m pytest services/video-ingest/tests -q

  detector:
    name: Detector concurrency and configuration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest services/detector/tests -q
      - run: python -m pytest services/stream-publisher/tests -q
